name: Stage 1 Policy Self-Test

on:
  pull_request:
    paths:
      - 'scripts/ci/stage1_change_classifier.py'
      - 'scripts/ci/test_stage1_change_classifier.py'
      - 'scripts/ci/test_stage1_evidence_contract.py'
      - 'scripts/ci/evidence_schema.json'
      - 'EduTalent-Workflow-Trigger-Guide.md'
      - 'EduTalent-Stage1-Smart-CI-CD-and-Build-Optimization-Plan.md'
      - '.github/workflows/stage1-policy-self-test.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage1-policy-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  policy-self-test:
    name: Validate Stage 1 shadow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Run classifier matrix
        run: python3 scripts/ci/test_stage1_change_classifier.py

      - name: Verify evidence contract
        run: python3 scripts/ci/test_stage1_evidence_contract.py

      - name: Classify exact PR diff in shadow mode
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | sort -u > stage1-changed-files.txt
          python3 scripts/ci/stage1_change_classifier.py \
            --files-from stage1-changed-files.txt \
            --output stage1-shadow-classification.json \
            --pretty
          cat stage1-shadow-classification.json

      - name: Upload shadow classification
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: stage1-shadow-classification
          path: |
            stage1-changed-files.txt
            stage1-shadow-classification.json
          if-no-files-found: error
          retention-days: 3

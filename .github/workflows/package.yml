name: Package

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false

      - name: Verify checked-out proof identity
        env:
          PROOF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/stage1_verify_proof_head.sh

      - name: Prepare non-secret environment template
        run: cp .env.example .env

      - name: Verify Stage 1 build boundary contract
        run: python3 scripts/ci/test_stage1_build_contract.py

      - name: Validate centralized packaging and appliance definitions
        shell: bash
        run: |
          set +e
          bash -x edutalent validate > package-definition-validation.log 2>&1
          status=$?
          cat package-definition-validation.log
          exit "${status}"

      - name: Upload package-definition diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package-definition-validation
          path: package-definition-validation.log
          if-no-files-found: error
          retention-days: 7

  targeted:
    name: Targeted runtime image and migration replay
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:package')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EDUTALENT_BUILD_CACHE_SCOPE: edutalent-runtime
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false

      - name: Verify checked-out proof identity
        env:
          PROOF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/stage1_verify_proof_head.sh

      - uses: docker/setup-buildx-action@v4
        with:
          name: edutalent-builder
          keep-state: true

      - name: Prepare non-secret environment template
        run: cp .env.example .env

      - name: Build exact-head runtime image through shared BuildKit cache
        shell: bash
        run: |
          set -o pipefail
          bash edutalent build local 2>&1 | tee targeted-runtime-build.log

      - name: Verify runtime image content contract
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh edutalent:local -ec '
            test -x /opt/edutalent/server
            test -x /opt/edutalent/ai_gateway
            test -x /opt/edutalent/scripts/ci/apply_migrations.sh
            test -x /opt/edutalent/scripts/ci/configure_database_role.sh
            test -d /opt/edutalent/packages/api/migration/migrations
            test -d /opt/edutalent/migrations
            command -v psql >/dev/null
          '

      - name: Verify packaged migrations are repeatable
        shell: bash
        run: |
          set -o pipefail
          docker compose --env-file .env -f compose.release.yaml up --detach database 2>&1 | tee targeted-migrations.log
          docker compose --env-file .env -f compose.release.yaml run --rm migrate 2>&1 | tee -a targeted-migrations.log
          docker compose --env-file .env -f compose.release.yaml run --rm migrate 2>&1 | tee -a targeted-migrations.log

      - name: Upload targeted build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: targeted-package-validation
          path: |
            targeted-runtime-build.log
            targeted-migrations.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop targeted validation services
        if: always()
        run: docker compose --env-file .env -f compose.release.yaml down --volumes --remove-orphans

  package:
    name: Docker image and release bundle
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EDUTALENT_BUILD_CACHE_SCOPE: edutalent-runtime
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false

      - name: Verify checked-out proof identity
        env:
          PROOF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/stage1_verify_proof_head.sh

      - uses: docker/setup-buildx-action@v4
        with:
          name: edutalent-builder
          keep-state: true

      - name: Prepare non-secret environment template
        run: cp .env.example .env

      - name: Resolve package version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_VERSION:-}"
          if [[ -n "${requested}" ]]; then
            version="${requested}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA::12}"
          fi
          [[ "${version}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || {
            echo "Version must be a safe tag and path component." >&2
            exit 2
          }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build release bundle through unified command
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash edutalent package "${PACKAGE_VERSION}" 2>&1 | tee package-build.log

      - name: Verify packaged migrations are repeatable
        shell: bash
        run: |
          set -o pipefail
          docker compose --env-file .env -f compose.release.yaml up --detach database 2>&1 | tee package-migrations.log
          docker compose --env-file .env -f compose.release.yaml run --rm migrate 2>&1 | tee -a package-migrations.log
          docker compose --env-file .env -f compose.release.yaml run --rm migrate 2>&1 | tee -a package-migrations.log

      - name: Verify archive identity and packaged health
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bundle="dist/edutalent-${PACKAGE_VERSION}"
          (cd "$bundle" && sha256sum --check SHA256SUMS)
          image="edutalent:${PACKAGE_VERSION}"
          # The build left this tag in the daemon. Remove it so an archive with
          # a missing/wrong tag cannot accidentally test the local build.
          docker image rm "$image"
          if docker image inspect "$image" >/dev/null 2>&1; then
            echo "Packaged image tag was not cleared" >&2
            exit 1
          fi
          gzip -dc "$bundle/edutalent-image.tar.gz" | docker load
          image_id="$(docker image inspect "$image" --format '{{.Id}}')"

          # A local Auth fixture supplies configuration without contacting a
          # production tenant. This proves packaged startup, not external Auth
          # or Storage qualification (which remains manual/external evidence).
          node tests/e2e/fixtures/mock-idp.mjs > package-auth-fixture.log 2>&1 &
          fixture_pid=$!
          container=""
          cleanup() {
            if [[ -n "$container" ]]; then
              docker logs "$container" > package-runtime.log 2>&1 || true
              docker rm -f "$container" >/dev/null || true
            fi
            kill "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          container="$(docker run --detach --network host --read-only --tmpfs /tmp \
            --env-file .env \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/edutalent \
            -e SUPABASE_URL=http://127.0.0.1:9100 \
            -e SUPABASE_PROJECT_REF=e2e-local \
            -e SUPABASE_JWT_ISSUER=http://127.0.0.1:9100/auth/v1 \
            -e SUPABASE_PUBLISHABLE_KEY=e2e-publishable \
            -e SUPABASE_SECRET_KEY=e2e-server-only \
            -e PORT=8080 -e RUN_MIGRATIONS=false \
            "$image" server)"
          test "$(docker inspect "$container" --format '{{.Image}}')" = "$image_id"
          healthy=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/healthz > package-healthz.txt; then
              healthy=true
              break
            fi
            test "$(docker inspect "$container" --format '{{.State.Running}}')" = true
            sleep 1
          done
          test "$healthy" = true
          test "$(cat package-healthz.txt)" = ok
          curl --fail --silent http://127.0.0.1:8080/readyz > package-readyz.txt
          test "$(cat package-readyz.txt)" = ready
          export PACKAGE_IMAGE_ID="$image_id"
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ["PACKAGE_VERSION"]
          archive = Path(f"dist/edutalent-{version}.tar.gz")
          evidence = {
              "head_sha": os.environ["GITHUB_SHA"],
              "version": version,
              "image_id": os.environ["PACKAGE_IMAGE_ID"],
              "archive_sha256": hashlib.file_digest(archive.open("rb"), "sha256").hexdigest(),
              "image_archive_checksums": "passed",
              "loaded_image_identity": "passed",
              "healthz": Path("package-healthz.txt").read_text(),
              "readyz": Path("package-readyz.txt").read_text(),
              "external_auth_storage_qualified": False,
          }
          Path("package-runtime-evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          PYCODE

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package-validation-logs
          path: |
            package-build.log
            package-migrations.log
            package-runtime.log
            package-auth-fixture.log
            package-healthz.txt
            package-readyz.txt
            package-runtime-evidence.json
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v6
        with:
          name: edutalent-${{ steps.version.outputs.version }}
          path: |
            dist/edutalent-${{ steps.version.outputs.version }}.tar.gz
            dist/edutalent-${{ steps.version.outputs.version }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Stop packaging services
        if: always()
        run: docker compose --env-file .env -f compose.release.yaml down --volumes --remove-orphans
